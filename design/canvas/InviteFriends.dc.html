<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite friends</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <div class="m-sub">
    <a class="m-icon-btn nk-glass" href="PrivateRoom.dc.html" aria-label="Back to room"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 class="d ol" style="font-size: 26px; line-height: 28px">Invite friends</h1>
    <div class="m-tabs nk-glass">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{ t.pick }}" class="m-tab" style="background: {{ t.bg }}; color: {{ t.fg }}">{{ t.name }}</button>
      </sc-for>
    </div>
  </div>

  <div class="abs" style="left: var(--sl); top: 68px; width: 452px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{ friends }}" as="f" hint-placeholder-count="8">
      <div class="nk-glass m-row" style="height: 56px; padding: 0 6px 0 8px; box-sizing: border-box; border-radius: 12px; gap: 6px">
        <span class="m-av" style="width: 32px; height: 32px; font-size: 14px; background: {{ f.color }}">{{ f.initial }}</span>
        <span class="m-col" style="gap: 0; flex-grow: 1; min-width: 0"><b class="d" style="font-size: 14px">{{ f.name }}</b><span class="m-small" style="color: {{ f.dot }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ f.sub }}</span></span>
        <button type="button" onClick="{{ f.toggle }}" class="m-btn m-btn--sm {{ f.btnClass }}" style="min-height: 44px; padding: 0 10px">{{ f.action }}</button>
      </div>
    </sc-for>
  </div>

  <div class="nk-glass m-col abs" style="left: 524px; right: var(--sr); top: 68px; padding: 12px; box-sizing: border-box; border-radius: 16px; gap: 8px">
    <span class="d ol-sm" style="font-size: 18px">Not on Naija Kart yet?</span>
    <span class="m-small" style="color: var(--ink-muted)">Send the room link. It opens the game, or the store if they don't have it.</span>
    <button type="button" class="m-btn m-btn--social">Share on WhatsApp</button>
    <span class="m-row" style="gap: 6px">
      <button type="button" class="m-btn m-btn--sec" style="flex-grow: 1">Copy link</button>
      <button type="button" class="m-btn m-btn--sec" style="flex-grow: 1">Show QR</button>
    </span>
    <span class="m-row" style="justify-content: space-between"><span class="m-label">Room code</span><span class="d" style="font-size: 17px; letter-spacing: 0.08em">EKO-427</span></span>
  </div>

  <a class="m-btn m-btn--primary abs" href="PrivateRoom.dc.html" style="left: 524px; right: var(--sr); bottom: var(--sb)">{{ doneLabel }}</a>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Online', invited: { Ngozi: true } }; }
  renderVals() {
    const s = this.state;
    const all = {
      Online: [['Chuks', 'In your room', 'var(--rank-odogwu)', 'in'], ['Ngozi', 'Online', 'var(--rank-oga-patapata)', 'on'], ['Femi', 'Online', 'var(--rank-no-dull)', 'on'], ['Musa', 'Joining your room', 'var(--rank-sharp-sharp)', 'in'], ['Bisi', 'In your room', 'var(--rank-sabi)', 'in'], ['Amaka', 'Racing · back soon', 'var(--rank-sabi)', 'busy'], ['Kelechi', 'Online', 'var(--rank-jjc)', 'on'], ['Zainab', 'Online', 'var(--rank-jjc)', 'on']],
      'All friends': [['Hauwa', 'Seen 2h ago', 'var(--rank-chairman)', 'off'], ['Tunde', 'Seen yesterday', 'var(--rank-odogwu)', 'off'], ['Femi', 'Online', 'var(--rank-no-dull)', 'on'], ['Kelechi', 'Online', 'var(--rank-jjc)', 'on'], ['Ada', 'Seen 3 days ago', 'var(--rank-jjc)', 'off'], ['Sani', 'Seen last week', 'var(--rank-sabi)', 'off'], ['Zainab', 'Online', 'var(--rank-jjc)', 'on'], ['Ngozi', 'Online', 'var(--rank-oga-patapata)', 'on']],
      'Recent racers': [['Damilola', 'Raced you today', 'var(--rank-oga-patapata)', 'on'], ['Kunle_x', 'Raced you today', 'var(--rank-sabi)', 'off'], ['Lola Speed', 'Raced you yesterday', 'var(--rank-chairman)', 'on'], ['Abdul K', 'Raced you yesterday', 'var(--rank-oga-patapata)', 'off']]
    };
    const list = all[s.tab];
    const count = Object.keys(s.invited).filter(k => s.invited[k]).length;
    return {
      tabs: ['Online', 'All friends', 'Recent racers'].map(n => ({ name: n, pick: () => this.setState({ tab: n }), bg: n === s.tab ? 'var(--danfo)' : 'transparent', fg: n === s.tab ? 'var(--on-danfo)' : 'var(--ink-muted)' })),
      friends: list.map(([name, sub, color, st]) => {
        const inv = !!s.invited[name];
        return {
          name, sub, color, initial: name[0],
          dot: st === 'on' ? 'var(--lagoon)' : st === 'in' ? 'var(--success)' : st === 'busy' ? 'var(--danfo)' : 'var(--ink-muted)',
          action: st === 'in' ? 'In room' : inv ? 'Invited' : st === 'off' ? 'Notify' : 'Invite',
          btnClass: st === 'in' || inv ? 'm-btn--sec' : 'm-btn--social',
          toggle: () => { if (st !== 'in') this.setState({ invited: { ...s.invited, [name]: !inv } }); }
        };
      }),
      doneLabel: count ? 'Done · ' + count + ' invited' : 'Done'
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <nav class="m-rail nk-glass" aria-label="Main">
    <a href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a class="on" href="Garage.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M3 15l2-6h14l2 6v4H3z"></path><circle cx="7.5" cy="19" r="1.5"></circle><circle cx="16.5" cy="19" r="1.5"></circle></svg>Garage</a>
    <a href="Social.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.9 2.6 2.6 3 5.2"></path></svg>Social</a>
    <a href="Profile.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Profile</a>
  </nav>

  <div class="m-top">
    <div class="m-tabs nk-glass">
      <a class="m-tab on" href="Garage.dc.html">Karts</a>
      <a class="m-tab" href="GarageRacers.dc.html">Racers</a>
      <a class="m-tab" href="GarageStyle.dc.html">Style</a>
    </div>
    <span style="flex-grow: 1"></span>
    <span class="m-cur nk-glass"><span class="m-coin m-coin--c">C</span>12,480</span>
    <a class="m-cur nk-glass" href="Shop.dc.html"><span class="m-coin m-coin--p">P</span>350</a>
  </div>

  <div class="photo-danfo abs" role="img" aria-label="Danfo kart, drag to rotate" style="left: 128px; top: 64px; width: 356px; height: 248px; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--glass-edge), 0 0 0 2px var(--outline)"></div>
  <span class="m-chip nk-glass abs" style="left: 248px; top: 276px">Drag to rotate</span>

  <div class="nk-glass m-col abs" style="left: 496px; right: var(--sr); top: 64px; padding: 10px 12px; border-radius: 16px; gap: 6px">
    <span class="m-row" style="justify-content: space-between"><span class="d ol" style="font-size: 26px; line-height: 26px">Danfo</span><span class="m-tag" style="background: var(--success); color: var(--on-lagoon)">Owned</span></span>
    <span class="m-small" style="color: var(--ink-muted)">Heavy hitter, strong off the line</span>
    <sc-for list="{{ stats }}" as="s" hint-placeholder-count="6">
      <span class="m-row" style="justify-content: space-between">
        <span class="m-small" style="color: var(--ink-muted); text-transform: uppercase">{{ s.name }}</span>
        <span class="m-row" style="gap: 3px">
          <sc-for list="{{ s.segs }}" as="g" hint-placeholder-count="6"><i style="width: 18px; height: 8px; border-radius: 3px; background: {{ g.c }}"></i></sc-for>
        </span>
      </span>
    </sc-for>
  </div>

  <div class="abs" style="left: 496px; right: var(--sr); top: 256px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px">
    <sc-for list="{{ karts }}" as="k" hint-placeholder-count="5">
      <button type="button" class="nk-glass m-col" style="height: 48px; border: 0; border-radius: 10px; cursor: pointer; color: var(--ink); font-family: var(--font-text); align-items: center; justify-content: center; gap: 1px; box-shadow: {{ k.ring }}">
        <span class="d" style="font-size: 13px; color: {{ k.color }}">{{ k.name }}</span>
        <span style="font-size: 11px; font-weight: 900; color: var(--ink-muted)">{{ k.state }}</span>
      </button>
    </sc-for>
  </div>

  <div class="m-row abs" style="right: var(--sr); bottom: var(--sb); gap: 8px">
    <a class="m-btn m-btn--sec" href="GarageStyle.dc.html">Customize</a>
    <a class="m-btn m-btn--primary" href="Main.dc.html" style="min-width: 150px">Ride am</a>
  </div>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  renderVals() {
    const st = [['Speed', 4], ['Accel', 5], ['Handling', 3], ['Drift', 3], ['Weight', 5], ['Boost', 2]];
    const list = [['Danfo', 'Selected', true, false], ['Keke', 'Owned', false, false], ['Okada', 'Owned', false, false], ['Camry', '5,000 C', false, true], ['SUV', 'Lvl 12', false, true]];
    return {
      stats: st.map(([name, n]) => ({ name, segs: [0, 1, 2, 3, 4, 5].map(i => ({ c: i < n ? 'var(--ink)' : 'var(--plate-600)' })) })),
      karts: list.map(([name, state, sel, locked]) => ({
        name, state, color: locked ? 'var(--ink-faint)' : 'var(--ink)',
        ring: sel ? 'inset 0 0 0 2px var(--danfo), 0 3px 0 var(--danfo-deep)' : 'inset 0 1px 0 var(--glass-edge)'
      }))
    };
  }
}
</script>
</body>
</html>

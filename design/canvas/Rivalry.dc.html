<!doctype html>

<body>
<x-dc>
<helmet>

<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>

  <div class="m-sub">
    <a class="m-icon-btn nk-glass" href="Social.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span class="m-eyebrow">Rivalry · since August</span>
  </div>

  <div class="m-row abs" style="left: 0; right: 0; top: 52px; justify-content: center; gap: 28px">
    <div class="m-col" style="align-items: center; gap: 3px; width: 240px">
      <span class="m-av photo-face" role="img" aria-label="Tife" style="width: 52px; height: 52px; box-shadow: inset 0 0 0 4px var(--danfo), 0 0 0 3px var(--outline)">T</span>
      <span class="d ol" style="font-size: 28px; line-height: 28px">Tife</span>
      <span class="m-small" style="color: var(--rank-chairman)">CHAIRMAN II</span>
      <span class="m-row" style="gap: 6px; align-items: baseline"><span class="d ol-lg" style="font-size: 46px; line-height: 44px; color: var(--danfo)">10</span><span class="m-eyebrow">wins</span></span>
    </div>
    <span class="d ol-lg" style="font-size: 54px">VS</span>
    <div class="m-col" style="align-items: center; gap: 3px; width: 240px">
      <span class="m-av" style="width: 52px; height: 52px; font-size: 24px; background: var(--rank-odogwu); box-shadow: inset 0 0 0 4px var(--ink), 0 0 0 3px var(--outline)">C</span>
      <span class="d ol" style="font-size: 28px; line-height: 28px">Chuks</span>
      <span class="m-small" style="color: var(--rank-chairman)">CHAIRMAN III</span>
      <span class="m-row" style="gap: 6px; align-items: baseline"><span class="d ol-lg" style="font-size: 46px; line-height: 44px">9</span><span class="m-eyebrow">wins</span></span>
    </div>
  </div>

  <div class="nk-glass abs" style="left: var(--sl); right: var(--sr); bottom: 84px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 8px 14px; border-radius: 14px">
    <span class="m-col" style="gap: 1px"><span class="m-eyebrow">Streak</span><span class="m-row" style="gap: 4px"><span class="d ol-sm" style="font-size: 18px; color: var(--danfo)">Tife +3</span></span></span>
    <span class="m-col" style="gap: 3px"><span class="m-eyebrow">Last 5</span><span class="m-row" style="gap: 3px"><span class="m-tag" style="background: var(--danfo); color: var(--on-danfo)">W</span><span class="m-tag" style="background: var(--danfo); color: var(--on-danfo)">W</span><span class="m-tag" style="background: var(--danfo); color: var(--on-danfo)">W</span><span class="m-tag">L</span><span class="m-tag">L</span></span></span>
    <span class="m-col" style="gap: 1px"><span class="m-eyebrow">Third Mainland</span><span style="font-size: 12px; font-weight: 900">You 3:18.40 · Him 3:18.02</span></span>
    <span class="m-col" style="gap: 1px"><span class="m-eyebrow">Bails</span><span style="font-size: 12px; font-weight: 900">He bailed you 4 times</span></span>

  <div class="m-row abs" style="left: var(--sl); right: var(--sr); bottom: var(--sb); justify-content: space-between">
    <span class="m-row" style="gap: 6px"><span class="m-tag" style="background: var(--enforcer); color: var(--on-enforcer)">Wahala dey</span><span class="m-small">Chuks beat your best time. You go let am?</span></span>
    <a class="m-btn m-btn--primary" href="Lobby.dc.html" style="min-width: 180px">Run am back</a>

  <div class="island"></div><div class="homebar"></div>
</div></div>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone number</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <div class="m-sub">
    <a class="m-icon-btn nk-glass" href="SaveProgress.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span class="m-chip nk-glass">Step 1 of 3</span>
  </div>

  <div class="m-col abs" style="left: var(--sl); top: 66px; width: 420px; gap: 8px">
    <h1 class="d ol" style="font-size: 30px; line-height: 32px">Your phone number</h1>
    <span class="m-label">Mobile number</span>
    <div class="m-row" style="gap: 8px">
      <button type="button" class="m-field" style="border: 0; padding: 0 12px; font-size: 16px; cursor: pointer; flex: none">NG +234<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      <div class="m-field {{ fieldClass }}" style="flex-grow: 1" role="textbox" aria-label="Phone number">
        <span>{{ shown }}</span><span class="m-caret"></span>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><span style="color: var(--ink-muted); font-weight: 800; font-size: 16px">803 000 0000</span></sc-if>
      </div>
    </div>
    <span class="m-small" style="color: {{ helpColor }}">{{ help }}</span>
    <sc-if value="{{ valid }}" hint-placeholder-val="{{ false }}">
      <a class="m-btn m-btn--primary" href="Otp.dc.html" style="align-self: flex-start; min-width: 220px">Send code</a>
    </sc-if>
    <sc-if value="{{ invalid }}" hint-placeholder-val="{{ true }}">
      <span class="m-btn m-btn--primary off" style="align-self: flex-start; min-width: 220px">Send code</span>
    </sc-if>
    <a class="m-btn" href="Otp.dc.html" style="align-self: flex-start; padding: 0; background: transparent; color: var(--lagoon)">Get the code on WhatsApp instead</a>
    <span class="m-small" style="color: var(--ink-muted)">We text one 6-digit code. Standard SMS rates may apply. By continuing you agree to the Terms and Privacy Policy.</span>
  </div>

  <div class="nk-glass abs" style="right: var(--sr); top: 66px; width: 276px; padding: 10px; box-sizing: border-box; border-radius: 18px">
    <div class="m-pad">
      <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
        <button type="button" onClick="{{ k.press }}" class="{{ k.cls }}" aria-label="{{ k.label }}">{{ k.text }}</button>
      </sc-for>
    </div>
  </div>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { d: '803412' }; }
  renderVals() {
    const d = this.state.d;
    const shown = [d.slice(0, 3), d.slice(3, 6), d.slice(6, 10)].filter(Boolean).join(' ');
    const valid = d.length === 10;
    const add = n => () => {
      let next = this.state.d + n;
      if (next === '0') next = '';
      if (next.length <= 10) this.setState({ d: next });
    };
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => {
      if (k === '') return { text: '', label: 'blank', cls: 'ghost', press: () => {} };
      if (k === 'del') return { text: '⌫', label: 'Delete', cls: 'ghost', press: () => this.setState({ d: this.state.d.slice(0, -1) }) };
      return { text: k, label: k, cls: '', press: add(k) };
    });
    return {
      shown, empty: d.length === 0, valid, invalid: !valid, keys,
      fieldClass: valid ? 'ok' : 'on',
      help: valid ? 'Looks good. Tap Send code.' : 'Type the 10 digits after +234. Leave out the first 0.',
      helpColor: valid ? 'var(--success)' : 'var(--ink-muted)'
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage: racers</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <nav class="m-rail nk-glass" aria-label="Main">
    <a href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a class="on" href="Garage.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M3 15l2-6h14l2 6v4H3z"></path><circle cx="7.5" cy="19" r="1.5"></circle><circle cx="16.5" cy="19" r="1.5"></circle></svg>Garage</a>
    <a href="Social.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.9 2.6 2.6 3 5.2"></path></svg>Social</a>
    <a href="Profile.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Profile</a>
  </nav>

    <div class="m-top">
    <div class="m-tabs nk-glass">
      <a class="m-tab" href="Garage.dc.html">Karts</a>
      <a class="m-tab on" href="GarageRacers.dc.html">Racers</a>
      <a class="m-tab" href="GarageStyle.dc.html">Style</a>
    </div>
    <span style="flex-grow: 1"></span>
    <span class="m-cur nk-glass"><span class="m-coin m-coin--c">C</span>12,480</span>
    <a class="m-cur nk-glass" href="Shop.dc.html"><span class="m-coin m-coin--p">P</span>350</a>
  </div>

  <div class="nk-glass abs" style="left: 128px; top: 64px; width: 356px; height: 248px; border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--glass-edge), 0 0 0 2px var(--outline); display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, {{ glow }} 0%, var(--plate-800) 70%)">
    <span class="m-av {{ bigClass }}" role="img" aria-label="{{ name }}" style="width: 168px; height: 168px; font-size: 72px; background: {{ bg }}; box-shadow: 0 0 0 4px var(--outline), 0 0 0 9px {{ ring }}">{{ letter }}</span>
  </div>
  <span class="m-chip nk-glass abs" style="left: 140px; top: 276px">Looks only · every racer drives the same</span>

  <div class="nk-glass m-col abs" style="left: 496px; right: var(--sr); top: 64px; height: 184px; box-sizing: border-box; padding: 10px 12px; border-radius: 16px; gap: 6px">
    <span class="m-row" style="justify-content: space-between"><span class="d ol" style="font-size: 26px; line-height: 26px">{{ name }}</span><span class="m-tag" style="background: {{ tagBg }}; color: {{ tagFg }}">{{ tag }}</span></span>
    <span class="m-small" style="color: var(--ink-muted)">{{ bio }}</span>
    <span class="m-row" style="gap: 8px; padding: 6px 6px 6px 12px; border-radius: 12px; background: var(--plate-glass-solid)">
      <span class="m-col" style="gap: 0; flex-grow: 1"><span class="m-label">Voice line</span><b class="d" style="font-size: 16px; color: var(--danfo)">"{{ line }}"</b></span>
      <button type="button" class="m-icon-btn" aria-label="Play voice line" style="background: var(--plate-700)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></button>
    </span>
    <span class="m-row m-small" style="justify-content: space-between"><span style="color: var(--ink-muted)">Races with this racer</span><b>{{ races }}</b></span>
  </div>

  <div class="abs" style="left: 496px; right: var(--sr); top: 256px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px">
    <sc-for list="{{ racers }}" as="r" hint-placeholder-count="6">
      <button type="button" onClick="{{ r.pick }}" class="nk-glass m-col" style="height: 56px; border: 0; border-radius: 10px; cursor: pointer; color: var(--ink); font-family: var(--font-text); align-items: center; justify-content: center; gap: 2px; box-shadow: {{ r.ring }}">
        <span class="m-av {{ r.cls }}" style="width: 26px; height: 26px; font-size: 13px; background: {{ r.bg }}; opacity: {{ r.op }}">{{ r.letter }}</span>
        <span style="font-size: 11px; font-weight: 900; color: {{ r.stateColor }}">{{ r.state }}</span>
      </button>
    </sc-for>
  </div>

  <div class="m-row abs" style="right: var(--sr); bottom: var(--sb); gap: 8px">
    <a class="m-btn m-btn--sec" href="GarageStyle.dc.html">Outfits</a>
    <sc-if value="{{ owned }}" hint-placeholder-val="{{ true }}">
      <a class="m-btn m-btn--primary" href="Main.dc.html" style="min-width: 150px">{{ cta }}</a>
    </sc-if>
    <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
      <a class="m-btn m-btn--primary" href="Shop.dc.html" style="min-width: 150px">{{ cta }}</a>
    </sc-if>
  </div>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const list = [
      { name: 'Tife', l: 'photo', bg: 'var(--plate-700)', glow: 'var(--danfo)', bio: 'Eko boy, no dey brake. Your starter racer.', line: 'Comot for road!', races: '142', state: 'Selected', own: true },
      { name: 'Amaka', l: 'A', bg: 'var(--rank-sabi)', glow: 'var(--rank-sabi)', bio: 'Corner queen from Enugu. Never misses an apex.', line: 'I don pass you!', races: '18', state: 'Owned', own: true },
      { name: 'Kunle', l: 'K', bg: 'var(--rank-odogwu)', glow: 'var(--rank-odogwu)', bio: 'Danfo driver turned racer. Knows every shortcut.', line: 'Oya, enter!', races: '6', state: 'Owned', own: true },
      { name: 'Zainab', l: 'Z', bg: 'var(--rank-sharp-sharp)', glow: 'var(--rank-sharp-sharp)', bio: 'Calm head, fast hands. Kano born.', line: 'Gently, I win.', races: '0', state: '800 C', own: false, cta: 'Get for 800 C' },
      { name: 'Obi', l: 'O', bg: 'var(--lagoon)', glow: 'var(--lagoon)', bio: 'Never misses a shortcut, never pays a fine.', line: 'LASTMA no fit catch me', races: '0', state: 'Lvl 8', own: false, cta: 'Unlocks at Lvl 8' },
      { name: 'Dami', l: 'D', bg: 'var(--rank-chairman)', glow: 'var(--rank-chairman)', bio: 'Owambe energy, full speed. Season 1 pass racer.', line: 'Spray me money!', races: '0', state: 'Pass', own: false, cta: 'Get Season Pass' }
    ];
    const c = list[this.state.i];
    return {
      name: c.name, bio: c.bio, line: c.line, races: c.races, bg: c.bg, glow: c.glow,
      bigClass: c.l === 'photo' ? 'photo-face' : '', letter: c.l === 'photo' ? 'T' : c.l,
      ring: c.own ? 'var(--danfo)' : 'var(--plate-600)',
      tag: c.own ? (this.state.i === 0 ? 'Selected' : 'Owned') : 'Locked',
      tagBg: c.own ? 'var(--success)' : 'var(--plate-700)', tagFg: c.own ? 'var(--on-lagoon)' : 'var(--ink-muted)',
      owned: c.own, locked: !c.own,
      cta: c.own ? 'Ride am' : c.cta,
      racers: list.map((r, i) => ({
        letter: r.l === 'photo' ? 'T' : r.l, cls: r.l === 'photo' ? 'photo-face' : '', bg: r.bg,
        op: r.own ? 1 : 0.5, state: r.state,
        stateColor: r.own ? 'var(--ink-muted)' : 'var(--ink-muted)',
        ring: i === this.state.i ? 'inset 0 0 0 2px var(--danfo), 0 3px 0 var(--danfo-deep)' : 'inset 0 1px 0 var(--glass-edge)',
        pick: () => this.setState({ i })
      }))
    };
  }
}
</script>
</body>
</html>

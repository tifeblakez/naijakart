<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Private room</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <div class="m-sub">
    <a class="m-icon-btn nk-glass" href="ModeSelect.dc.html" aria-label="Leave room"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span class="m-col" style="gap: 0"><span class="m-eyebrow" style="color: var(--danfo)">Private Room · you are host</span><h1 class="d ol" style="font-size: 26px; line-height: 28px">Tife's room</h1></span>
    <span style="flex-grow: 1"></span>
    <span class="m-col nk-glass" style="gap: 0; padding: 4px 12px; border-radius: 12px; align-items: flex-end"><span class="m-label">Room code</span><span class="d" style="font-size: 20px; letter-spacing: 0.08em">EKO-427</span></span>
  </div>

  <div class="abs" style="left: var(--sl); top: 70px; width: 440px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{ seats }}" as="s" hint-placeholder-count="8">
      <sc-if value="{{ s.filled }}" hint-placeholder-val="{{ true }}">
        <div class="nk-glass m-col" style="height: 92px; gap: 3px; padding: 8px 4px; box-sizing: border-box; border-radius: 12px; align-items: center; text-align: center; box-shadow: {{ s.ring }}">
          <span class="m-av {{ s.photo }}" style="width: 32px; height: 32px; font-size: 14px; background: {{ s.color }}; opacity: {{ s.op }}">{{ s.initial }}</span>
          <b class="d" style="font-size: 14px">{{ s.name }}</b>
          <span class="m-tag" style="height: 18px; background: {{ s.tagBg }}; color: {{ s.tagFg }}">{{ s.tag }}</span>
        </div>
      </sc-if>
      <sc-if value="{{ s.empty }}" hint-placeholder-val="{{ false }}">
        <a href="InviteFriends.dc.html" class="m-col" style="height: 92px; box-sizing: border-box; border-radius: 12px; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--ink-muted); border: 2px dashed var(--plate-600); background: var(--plate-glass)">
          <span class="d" style="font-size: 26px; line-height: 26px">+</span><b style="font-size: 12px">Invite</b>
        </a>
      </sc-if>
    </sc-for>
  </div>
  <span class="m-small abs" style="left: var(--sl); top: 272px; color: var(--ink-muted)">{{ readyLine }}</span>
  <div class="m-row abs" style="left: var(--sl); width: 440px; bottom: var(--sb); gap: 8px">
    <button type="button" class="m-btn m-btn--social" style="flex-grow: 1">Share on WhatsApp</button>
    <a class="m-btn m-btn--sec" href="InviteFriends.dc.html">Invite friends</a>
  </div>

  <div class="nk-glass m-col abs" style="left: 510px; right: var(--sr); top: 70px; padding: 8px 12px; box-sizing: border-box; border-radius: 16px; gap: 2px">
    <sc-for list="{{ settings }}" as="o" hint-placeholder-count="5">
      <button type="button" onClick="{{ o.next }}" class="m-row" style="min-height: 44px; border: 0; padding: 0; background: transparent; color: var(--ink); cursor: pointer; justify-content: space-between; font-family: var(--font-text)">
        <span class="m-small" style="color: var(--ink-muted); text-transform: uppercase">{{ o.name }}</span>
        <span class="m-row" style="gap: 4px"><b style="font-size: 13px; color: {{ o.color }}">{{ o.value }}</b><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg></span>
      </button>
    </sc-for>
  </div>
  <a class="m-btn m-btn--primary abs" href="Lobby.dc.html" style="left: 510px; right: var(--sr); bottom: var(--sb)">Start race</a>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { track: 0, laps: 1, lastma: 1, items: 0, ai: 1 }; }
  renderVals() {
    const s = this.state;
    const opts = {
      track: ['Third Mainland Rush', 'Lekki Toll Dash', 'Oshodi Market Run'],
      laps: ['2 laps', '3 laps', '5 laps'],
      lastma: ['Off', 'On', 'Madness'],
      items: ['On', 'Boosts only', 'Off'],
      ai: ['Off', 'Fill empty seats']
    };
    const names = { track: 'Track', laps: 'Laps', lastma: 'LASTMA', items: 'Items', ai: 'AI racers' };
    const seats = [
      ['You', 'Host', true, 'var(--plate-700)', 'var(--danfo)', 'var(--on-danfo)'],
      ['Chuks', 'Ready', false, 'var(--rank-odogwu)', 'var(--success)', 'var(--on-lagoon)'],
      ['Bisi', 'Ready', false, 'var(--rank-sabi)', 'var(--success)', 'var(--on-lagoon)'],
      ['Musa', 'Joining', false, 'var(--rank-sharp-sharp)', 'var(--plate-700)', 'var(--ink-muted)'],
      ['Ngozi', 'Invited', false, 'var(--rank-oga-patapata)', 'var(--plate-700)', 'var(--ink-muted)'],
      null, null, null
    ];
    const joined = seats.filter(x => x && (x[1] === 'Ready' || x[1] === 'Host')).length;
    return {
      seats: seats.map(x => x ? {
        filled: true, empty: false, name: x[0], tag: x[1], photo: x[2] ? 'photo-face' : '', initial: x[0][0], color: x[3], tagBg: x[4], tagFg: x[5],
        op: x[1] === 'Invited' || x[1] === 'Joining' ? 0.55 : 1,
        ring: x[1] === 'Host' ? 'inset 0 0 0 2px var(--danfo)' : 'inset 0 1px 0 var(--glass-edge)'
      } : { filled: false, empty: true }),
      settings: Object.keys(opts).map(k => ({
        name: names[k], value: opts[k][s[k]],
        color: k === 'lastma' && s[k] === 2 ? 'var(--enforcer)' : 'var(--ink)',
        next: () => this.setState({ [k]: (s[k] + 1) % opts[k].length })
      })),
      readyLine: joined + ' racers ready · ' + (s.ai === 1 ? 'AI fills the other seats' : 'no AI, friends only')
    };
  }
}
</script>
</body>
</html>

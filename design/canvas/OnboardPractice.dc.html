<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice lap</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-race"></div>

  <div class="m-col abs" style="left: var(--sl); top: var(--st); gap: 6px; align-items: flex-start">
    <span class="m-tag" style="background: var(--danfo); color: var(--on-danfo)">Step 4 of 5</span>
    <button type="button" class="m-btn m-btn--sec m-btn--sm nk-glass" style="min-height: 44px">Try Touch instead</button>
    <a class="m-btn m-btn--sm" href="OnboardReady.dc.html" style="min-height: 44px; background: transparent; color: var(--ink); padding: 0 4px"><span class="ol-sm">Skip practice</span></a>
  </div>

  <div class="m-lap nk-glass"><div class="ol-sm">PRACTICE</div><span>No pressure</span></div>

  <div class="nk-glass m-col abs" style="left: 50%; top: var(--st); transform: translateX(-50%); width: 360px; padding: 10px 14px; box-sizing: border-box; border-radius: 16px; gap: 6px">
    <span class="d ol" style="font-size: 22px; line-height: 24px; color: {{ headColor }}">{{ head }}</span>
    <sc-for list="{{ tips }}" as="t" hint-placeholder-count="3">
      <span class="m-row" style="gap: 8px; opacity: {{ t.op }}">
        <span style="width: 22px; height: 22px; border-radius: 99px; flex: none; display: grid; place-items: center; background: {{ t.dotBg }}; color: var(--plate-900); font-family: var(--font-display); font-size: 13px">{{ t.mark }}</span>
        <span class="m-col" style="gap: 0"><b style="font-size: 13px">{{ t.name }}</b><span class="m-small" style="color: var(--ink-muted)">{{ t.how }}</span></span>
      </span>
    </sc-for>
    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <a class="m-btn m-btn--primary" href="OnboardReady.dc.html">Continue</a>
    </sc-if>
  </div>

  <sc-if value="{{ driftNow }}" hint-placeholder-val="{{ true }}">
    <span class="d ol abs" style="right: 280px; bottom: 102px; width: 72px; text-align: center; font-size: 18px; color: var(--danfo)">Hold ▼</span>
  </sc-if>
  <button type="button" onClick="{{ doDrift }}" class="m-drift nk-glass" aria-label="Drift" style="box-shadow: {{ driftRing }}">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24c0-9 6-15 18-15"></path><path d="M19 4l5 5-5 5"></path></svg>Drift
  </button>

  <div class="m-speedo nk-glass"><div class="ring"></div><div class="read"><b class="ol-sm">96</b><span class="ol-sm">KM/H</span></div></div>

  <sc-if value="{{ itemNow }}" hint-placeholder-val="{{ false }}">
    <span class="d ol abs" style="right: 212px; bottom: 90px; width: 64px; text-align: center; font-size: 18px; color: var(--danfo)">Tap ▼</span>
  </sc-if>
  <div class="m-items">
    <button type="button" onClick="{{ doItem }}" class="m-item" style="--rim: {{ itemRim }}"><span class="nk-glass" style="outline: {{ itemOutline }}; outline-offset: 3px"><sc-if value="{{ hasItem }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 40 40"><path d="M30 8c-2 0-3 2-3 3-8 2-16 9-18 21 0 2 2 3 3 1 4-8 10-13 17-15 3-1 5-4 4-7 0-2-1-3-3-3z" fill="var(--enforcer)"></path><path d="M27 11c1-3 3-5 6-5" stroke="var(--item-boost)" stroke-width="3" fill="none" stroke-linecap="round"></path></svg></sc-if><sc-if value="{{ noItem }}" hint-placeholder-val="{{ false }}"><span class="d" style="font-size: 20px; color: var(--ink-faint)">?</span></sc-if></span><span class="ol-sm">{{ itemName }}</span></button>
    <button type="button" class="m-item" style="--rim: var(--plate-600)"><span class="nk-glass"><span class="d" style="font-size: 20px; color: var(--ink-faint)">?</span></span><span class="ol-sm">Empty</span></button>
    <button type="button" class="m-item" style="--rim: var(--plate-600)"><span class="nk-glass"><span class="d" style="font-size: 20px; color: var(--ink-faint)">?</span></span><span class="ol-sm">Empty</span></button>
    <button type="button" class="m-item" style="--rim: var(--plate-600)"><span class="nk-glass"><span class="d" style="font-size: 20px; color: var(--ink-faint)">?</span></span><span class="ol-sm">Empty</span></button>
  </div>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 1 }; }
  renderVals() {
    const s = this.state.step;
    const tips = [
      ['Steer', 'Tilt your phone left and right'],
      ['Drift', 'Hold DRIFT through the bend for a boost'],
      ['Use an item', 'Tap a slot. You can hold up to four']
    ];
    const pulse = '0 0 0 3px var(--danfo), 0 0 22px 6px var(--danfo), 0 3px 0 var(--outline)';
    return {
      head: s >= 3 ? 'Nice one! You sabi drive' : 'Practice lap · ' + (s + 1) + ' of 3',
      headColor: s >= 3 ? 'var(--success)' : 'var(--ink)',
      tips: tips.map(([name, how], i) => ({
        name, how,
        mark: i < s ? '✓' : String(i + 1),
        dotBg: i < s ? 'var(--success)' : i === s ? 'var(--danfo)' : 'var(--plate-600)',
        op: i <= s || s >= 3 ? 1 : 0.55
      })),
      done: s >= 3,
      driftNow: s === 1, itemNow: s === 2,
      doDrift: () => { if (this.state.step === 1) this.setState({ step: 2 }); },
      doItem: () => { if (this.state.step === 2) this.setState({ step: 3 }); },
      driftRing: s === 1 ? pulse : 'inset 0 0 0 4px var(--drift-1), 0 0 0 1.5px var(--outline), 0 3px 0 var(--outline)',
      hasItem: s < 3, noItem: s >= 3,
      itemName: s < 3 ? 'Jollof' : 'Empty',
      itemRim: s < 3 ? 'var(--item-boost)' : 'var(--plate-600)',
      itemOutline: s === 2 ? '3px solid var(--danfo)' : 'none'
    };
  }
}
</script>
</body>
</html>

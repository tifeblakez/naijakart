<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your controls</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <div class="m-sub">
    <a class="m-icon-btn nk-glass" href="OnboardDriver.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span class="m-tag" style="background: var(--danfo); color: var(--on-danfo)">Step 3 of 5</span>
  </div>

  <div class="m-col abs" style="left: 0; right: 0; top: 16px; align-items: center; gap: 2px">
    <h1 class="d ol" style="font-size: 32px; line-height: 34px">How you wan drive?</h1>
    <p class="m-body" style="color: var(--ink-muted)">Pick how you steer. Switch any time from the pause menu.</p>
  </div>

  <div class="m-row abs" style="left: 0; right: 0; top: 88px; justify-content: center; gap: 16px">
    <button type="button" onClick="{{ pickTilt }}" class="nk-glass m-col" style="width: 280px; height: 206px; border: 0; border-radius: 18px; cursor: pointer; color: var(--ink); font-family: var(--font-text); align-items: center; justify-content: center; gap: 6px; padding: 12px; box-shadow: {{ tiltRing }}">
      <svg viewBox="0 0 220 140" width="150" height="96" aria-hidden="true">
        <path d="M30 110 A90 90 0 0 1 190 110" fill="none" stroke="var(--ink-muted)" stroke-width="5" stroke-dasharray="9 9"></path>
        <g transform="rotate(-14 110 78)"><rect x="40" y="46" width="140" height="64" rx="14" fill="var(--plate-900)" stroke="var(--ink)" stroke-width="6"></rect><rect x="54" y="56" width="112" height="44" rx="6" fill="var(--boost)"></rect></g>
      </svg>
      <span class="d ol" style="font-size: 28px; line-height: 28px">Tilt</span>
      <span style="font-size: 14px; font-weight: 900">Turn your phone like a steering wheel</span>
    </button>
    <button type="button" onClick="{{ pickTouch }}" class="nk-glass m-col" style="width: 280px; height: 206px; border: 0; border-radius: 18px; cursor: pointer; color: var(--ink); font-family: var(--font-text); align-items: center; justify-content: center; gap: 6px; padding: 12px; box-shadow: {{ touchRing }}">
      <svg viewBox="0 0 220 140" width="150" height="96" aria-hidden="true">
        <rect x="20" y="30" width="180" height="96" rx="16" fill="var(--plate-900)" stroke="var(--ink)" stroke-width="6"></rect>
        <rect x="34" y="42" width="152" height="72" rx="8" fill="var(--boost)"></rect>
        <circle cx="76" cy="84" r="17" fill="none" stroke="var(--danfo)" stroke-width="6"></circle>
        <path d="M40 84l9-8M40 84l9 8M112 84l-9-8M112 84l-9 8" stroke="var(--on-danfo)" stroke-width="5" stroke-linecap="round"></path>
      </svg>
      <span class="d ol" style="font-size: 28px; line-height: 28px">Touch</span>
      <span style="font-size: 14px; font-weight: 900">Drag your left thumb to steer</span>
    </button>
  </div>

  <div class="m-row abs" style="left: var(--sl); right: var(--sr); bottom: var(--sb); justify-content: space-between">
    <span class="m-row m-small" style="gap: 6px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--success)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Your motion sensor works well</span>
    <a class="m-btn m-btn--primary" href="OnboardPractice.dc.html" style="min-width: 180px">Continue</a>
  </div>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'tilt' }; }
  renderVals() {
    const on = 'inset 0 0 0 3px var(--danfo), 0 4px 0 var(--danfo-deep)';
    const off = 'inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px var(--glass-sheen)';
    return {
      pickTilt: () => this.setState({ pick: 'tilt' }),
      pickTouch: () => this.setState({ pick: 'touch' }),
      tiltRing: this.state.pick === 'tilt' ? on : off,
      touchRing: this.state.pick === 'touch' ? on : off
    };
  }
}
</script>
</body>
</html>

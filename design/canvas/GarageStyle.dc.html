<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage: style</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <nav class="m-rail nk-glass" aria-label="Main">
    <a href="Main.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a class="on" href="Garage.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M3 15l2-6h14l2 6v4H3z"></path><circle cx="7.5" cy="19" r="1.5"></circle><circle cx="16.5" cy="19" r="1.5"></circle></svg>Garage</a>
    <a href="Social.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.9 2.6 2.6 3 5.2"></path></svg>Social</a>
    <a href="Profile.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Profile</a>
  </nav>

    <div class="m-top">
    <div class="m-tabs nk-glass">
      <a class="m-tab" href="Garage.dc.html">Karts</a>
      <a class="m-tab" href="GarageRacers.dc.html">Racers</a>
      <a class="m-tab on" href="GarageStyle.dc.html">Style</a>
    </div>
    <span style="flex-grow: 1"></span>
    <span class="m-cur nk-glass"><span class="m-coin m-coin--c">C</span>12,480</span>
    <a class="m-cur nk-glass" href="Shop.dc.html"><span class="m-coin m-coin--p">P</span>350</a>
  </div>

  <div class="abs" style="left: 128px; top: 64px; width: 356px; height: 248px; border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--glass-edge), 0 0 0 2px var(--outline)">
    <div class="photo-danfo" role="img" aria-label="Danfo kart preview" style="position: absolute; inset: 0"></div>
    <div style="position: absolute; inset: 0; background: {{ tint }}; mix-blend-mode: color; opacity: {{ tintOp }}"></div>
    <span class="m-chip abs" style="left: 10px; top: 10px; background: var(--plate-glass-solid)">{{ previewLabel }}</span>
  </div>
  <div class="m-row abs" style="left: 128px; top: 320px; width: 356px; gap: 5px; flex-wrap: wrap">
    <span class="m-label" style="margin-right: 2px">Equipped</span>
    <span class="m-tag">Danfo yellow</span><span class="m-tag">Stock rims</span><span class="m-tag">Jollof smoke</span>
  </div>

  <div class="nk-glass m-row abs" style="left: 496px; right: var(--sr); top: 64px; bottom: 84px; box-sizing: border-box; padding: 8px; border-radius: 16px; gap: 8px; align-items: stretch">
    <div class="m-col" style="gap: 4px; width: 86px; flex: none">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
        <button type="button" onClick="{{ c.pick }}" class="m-tab" style="min-height: 40px; padding: 0 10px; font-size: 11px; border-radius: 10px; background: {{ c.bg }}; color: {{ c.fg }}">{{ c.name }}</button>
      </sc-for>
    </div>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 6px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
        <button type="button" onClick="{{ it.pick }}" class="m-row" style="border: 0; border-radius: 10px; padding: 0 8px; cursor: pointer; color: var(--ink); font-family: var(--font-text); gap: 7px; text-align: left; background: var(--plate-glass-solid); box-shadow: {{ it.ring }}">
          <span style="width: 28px; height: 28px; border-radius: 8px; flex: none; background: {{ it.sw }}; box-shadow: 0 0 0 1.5px var(--outline)"></span>
          <span class="m-col" style="gap: 0; min-width: 0"><b style="font-size: 11px; line-height: 13px">{{ it.name }}</b><span style="font-size: 11px; font-weight: 900; color: {{ it.stateColor }}">{{ it.state }}</span></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div class="m-row abs" style="right: var(--sr); bottom: var(--sb); gap: 8px">
    <span class="m-small" style="color: var(--ink-muted); max-width: 150px; text-align: right">Looks only. Nothing here makes you faster.</span>
    <sc-if value="{{ canEquip }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ equip }}" class="m-btn m-btn--primary" style="min-width: 150px">{{ cta }}</button>
    </sc-if>
    <sc-if value="{{ mustBuy }}" hint-placeholder-val="{{ false }}">
      <a class="m-btn m-btn--primary" href="Shop.dc.html" style="min-width: 150px">{{ cta }}</a>
    </sc-if>
  </div>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'Paint', sel: 1, equipped: { Paint: 0, Wheels: 0, Trail: 0, Horn: 0, Stickers: 0 } }; }
  renderVals() {
    const s = this.state;
    const data = {
      Paint: [['Danfo yellow', 'var(--danfo)', 'own'], ['Lagoon teal', 'var(--lagoon)', 'own'], ['Night blue', 'var(--plate-600)', 'own'], ['Eko red', 'var(--enforcer)', '1,200 C'], ['Owambe gold', 'var(--rank-chairman)', '200 P'], ['Chrome', 'var(--ink-muted)', 'Lvl 15']],
      Wheels: [['Stock rims', 'var(--plate-600)', 'own'], ['Chrome okada', 'var(--ink-muted)', '2,000 C'], ['Gold spokes', 'var(--rank-chairman)', '150 P'], ['Neon blue', 'var(--boost)', 'own'], ['Keke slicks', 'var(--plate-700)', '900 C'], ['Fire rims', 'var(--enforcer)', 'Pass']],
      Trail: [['Jollof smoke', 'var(--enforcer)', 'own'], ['Lagoon mist', 'var(--lagoon)', 'own'], ['Naira notes', 'var(--success)', '250 P'], ['Harmattan dust', 'var(--danfo-deep)', '1,500 C'], ['Owambe glitter', 'var(--rank-chairman)', 'Pass'], ['None', 'var(--plate-800)', 'own']],
      Horn: [['Danfo horn', 'var(--danfo)', 'own'], ['Agbero whistle', 'var(--item-attack)', '1,500 C'], ['Talking drum', 'var(--danfo-deep)', '200 P'], ['Okada beep', 'var(--boost)', 'own'], ['Siren', 'var(--enforcer)', 'Lvl 20'], ['Owambe trumpet', 'var(--rank-chairman)', 'Pass']],
      Stickers: [['Eko for show', 'var(--drift-3)', 'own'], ['No shaking', 'var(--lagoon)', 'own'], ['Japa', 'var(--boost)', '800 C'], ['God when?', 'var(--danfo)', '100 P'], ['No carry last', 'var(--success)', 'Pass'], ['Blank', 'var(--plate-800)', 'own']]
    };
    const list = data[s.cat];
    const eq = s.equipped[s.cat];
    const cur = list[s.sel];
    const own = cur[2] === 'own';
    const isEq = s.sel === eq;
    return {
      cats: Object.keys(data).map(n => ({ name: n, pick: () => this.setState({ cat: n, sel: 0 }), bg: n === s.cat ? 'var(--danfo)' : 'transparent', fg: n === s.cat ? 'var(--on-danfo)' : 'var(--ink-muted)' })),
      items: list.map(([name, sw, st], i) => ({
        name, sw,
        state: i === eq ? 'Equipped' : st === 'own' ? 'Owned' : st,
        stateColor: i === eq ? 'var(--success)' : st === 'own' ? 'var(--ink-muted)' : 'var(--danfo)',
        ring: i === s.sel ? 'inset 0 0 0 2px var(--danfo)' : 'inset 0 1px 0 var(--glass-edge)',
        pick: () => this.setState({ sel: i })
      })),
      previewLabel: 'Previewing: ' + cur[0],
      tint: cur[1], tintOp: s.cat === 'Paint' && s.sel !== 0 ? 0.85 : 0,
      canEquip: own, mustBuy: !own,
      cta: !own ? (cur[2] === 'Pass' ? 'Get Season Pass' : /^Lvl/.test(cur[2]) ? 'Unlocks at ' + cur[2] : 'Buy ' + cur[2]) : isEq ? 'Equipped' : 'Equip',
      equip: () => this.setState({ equipped: { ...s.equipped, [s.cat]: s.sel } })
    };
  }
}
</script>
</body>
</html>

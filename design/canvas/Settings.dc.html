<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: data and performance</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <div class="m-sub">
    <a class="m-icon-btn nk-glass" href="Main.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 class="d ol" style="font-size: 26px; line-height: 28px">Settings</h1>
    <span style="flex-grow: 1"></span>
    <span class="m-chip nk-glass">Data used this month: [measured] MB</span>
  </div>

  <nav class="nk-glass m-col abs" aria-label="Settings sections" style="left: var(--sl); top: 64px; bottom: var(--sb); width: 140px; padding: 6px; box-sizing: border-box; border-radius: 14px; gap: 2px">
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="6">
      <button type="button" onClick="{{ s.pick }}" style="min-height: 44px; border: 0; border-radius: 10px; padding: 0 10px; text-align: left; cursor: pointer; font: 800 13px/16px Nunito, sans-serif; background: {{ s.bg }}; color: {{ s.fg }}">{{ s.name }}</button>
    </sc-for>
  </nav>

  <div class="nk-glass m-col abs" style="left: 208px; top: 64px; bottom: var(--sb); width: 300px; padding: 8px 12px; box-sizing: border-box; border-radius: 14px; gap: 4px">
    <span class="d ol-sm" style="font-size: 18px">Data and performance</span>
    <sc-for list="{{ toggles }}" as="t" hint-placeholder-count="3">
      <button type="button" onClick="{{ t.flip }}" aria-pressed="{{ t.on }}" class="m-row" style="min-height: 44px; border: 0; padding: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; gap: 10px">
        <span class="m-col" style="gap: 0; flex-grow: 1; min-width: 0"><b style="font-size: 13px; line-height: 16px">{{ t.name }}</b><span class="m-small" style="color: var(--ink-muted)">{{ t.sub }}</span></span>
        <span style="width: 48px; height: 28px; flex: none; border-radius: 999px; position: relative; background: {{ t.track }}; box-shadow: 0 0 0 1.5px var(--outline)"><span style="position: absolute; top: 3px; left: {{ t.knob }}; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); box-shadow: 0 2px 0 var(--outline)"></span></span>
      </button>
    </sc-for>
    <span class="m-eyebrow">Graphics quality</span>
    <div class="m-tabs" style="background: var(--plate-glass-solid); align-self: flex-start">
      <sc-for list="{{ quality }}" as="q" hint-placeholder-count="4">
        <button type="button" onClick="{{ q.pick }}" class="m-tab" style="background: {{ q.bg }}; color: {{ q.fg }}">{{ q.name }}</button>
      </sc-for>
    </div>
    <div class="m-row" style="justify-content: space-between">
    <span class="m-eyebrow">Frame rate</span>
    <div class="m-tabs" style="background: var(--plate-glass-solid)">
      <sc-for list="{{ fps }}" as="f" hint-placeholder-count="2">
        <button type="button" onClick="{{ f.pick }}" class="m-tab" style="background: {{ f.bg }}; color: {{ f.fg }}">{{ f.name }}</button>
      </sc-for>
    </div>
    </div>
  </div>

  <div class="m-col abs" style="left: 518px; right: var(--sr); top: 64px; bottom: var(--sb); gap: 8px">
    <div class="nk-glass m-col" style="padding: 8px 12px; border-radius: 14px; gap: 4px">
      <span class="m-eyebrow">Data used · this month</span>
      <span class="m-row" style="justify-content: space-between"><span class="m-small">Racing</span><b class="d" style="font-size: 14px">[measured] MB</b></span>
      <span class="m-row" style="justify-content: space-between"><span class="m-small">Downloads</span><b class="d" style="font-size: 14px">[measured] MB</b></span>
      <span class="m-small" style="color: var(--ink-muted)">One race uses about [measured] MB</span>
    </div>
    <div class="nk-glass m-col" style="padding: 8px 12px; border-radius: 14px; gap: 4px; flex-grow: 1">
      <span class="m-eyebrow">Content packs</span>
      <sc-for list="{{ packs }}" as="p" hint-placeholder-count="3">
        <div class="m-row" style="min-height: 44px; gap: 8px">
          <span class="m-col" style="gap: 0; flex-grow: 1; min-width: 0"><b style="font-size: 13px; line-height: 16px">{{ p.name }}</b><span class="m-small" style="color: {{ p.stateColor }}">{{ p.state }}</span></span>
          <button type="button" onClick="{{ p.act }}" class="m-btn {{ p.btnClass }} m-btn--sm" style="min-height: 44px; padding: 0 10px">{{ p.action }}</button>
        </div>
      </sc-for>
    </div>
  </div>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { section: 'Data', low: true, wifi: false, voice: true, quality: 'Auto', fps: '30', owned: { 'Lagos Island': true, 'Lekki Toll': true, 'Abuja Circle': false } };
  }
  renderVals() {
    const s = this.state;
    const tab = (cur, set) => n => ({ name: n, pick: () => set(n), bg: n === cur ? 'var(--danfo)' : 'transparent', fg: n === cur ? 'var(--on-danfo)' : 'var(--ink-muted)' });
    const tg = (key, name, sub) => ({
      name, sub, on: s[key] ? 'true' : 'false',
      flip: () => this.setState({ [key]: !s[key] }),
      track: s[key] ? 'var(--lagoon)' : 'var(--plate-700)',
      knob: s[key] ? '23px' : '3px'
    });
    const packs = [['Lagos Island', '[measured] MB'], ['Lekki Toll', '[measured] MB'], ['Abuja Circle', '[measured] MB']];
    return {
      sections: ['Data', 'Controls', 'Audio', 'Account', 'Language', 'Help'].map(tab(s.section, n => this.setState({ section: n }))),
      toggles: [
        tg('low', 'Low Data Mode', 'Smaller updates, fewer replays'),
        tg('wifi', 'Downloads on Wi-Fi only', 'Content packs wait for Wi-Fi'),
        tg('voice', 'Voice lines', 'Agbero and commentator shouts')
      ],
      quality: ['Auto', 'Low', 'Medium', 'High'].map(tab(s.quality, n => this.setState({ quality: n }))),
      fps: ['30', '60'].map(tab(s.fps, n => this.setState({ fps: n }))).map(f => ({ ...f, name: f.name + ' fps' })),
      packs: packs.map(([name, size]) => {
        const got = s.owned[name];
        return {
          name, action: got ? 'Delete' : 'Download',
          state: got ? 'On phone · ' + size : 'Not downloaded · ' + size,
          stateColor: got ? 'var(--success)' : 'var(--ink-muted)',
          btnClass: got ? 'm-btn--sec' : 'm-btn--primary',
          act: () => this.setState({ owned: { ...s.owned, [name]: !got } })
        };
      })
    };
  }
}
</script>
</body>
</html>

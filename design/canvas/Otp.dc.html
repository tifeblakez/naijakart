<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <div class="m-sub">
    <a class="m-icon-btn nk-glass" href="PhoneNumber.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span class="m-chip nk-glass">Step 2 of 3</span>
  </div>

  <div class="m-col abs" style="left: var(--sl); top: 66px; width: 430px; gap: 8px">
    <h1 class="d ol" style="font-size: 30px; line-height: 32px">Enter the code</h1>
    <p class="m-body">Sent by SMS to <b>+234 803 412 5567</b> · <a href="PhoneNumber.dc.html" style="color: var(--danfo)">Change</a></p>
    <div class="m-otp" role="group" aria-label="6-digit code">
      <sc-for list="{{ boxes }}" as="b" hint-placeholder-count="6"><span class="{{ b.cls }}">{{ b.v }}</span></sc-for>
    </div>
    <span class="m-row m-small" style="gap: 6px; color: {{ statusColor }}"><span class="m-dot"></span>{{ status }}</span>
    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <a class="m-btn m-btn--primary" href="CreateRacer.dc.html" style="align-self: flex-start; min-width: 220px">Verify</a>
    </sc-if>
    <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
      <span class="m-btn m-btn--primary off" style="align-self: flex-start; min-width: 220px">Verify</span>
    </sc-if>
    <span class="m-row" style="gap: 14px">
      <span class="m-small" style="color: var(--ink-muted)">Resend in 0:42</span>
      <button type="button" class="m-btn" style="padding: 0; background: transparent; color: var(--lagoon)">Send on WhatsApp</button>
    </span>
  </div>

  <div class="nk-glass abs" style="right: var(--sr); top: 66px; width: 276px; padding: 10px; box-sizing: border-box; border-radius: 18px">
    <div class="m-pad">
      <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
        <button type="button" onClick="{{ k.press }}" class="{{ k.cls }}" aria-label="{{ k.label }}">{{ k.text }}</button>
      </sc-for>
    </div>
  </div>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: '418' }; }
  renderVals() {
    const c = this.state.c;
    const done = c.length === 6;
    const boxes = [0, 1, 2, 3, 4, 5].map(i => ({
      v: c[i] || '',
      cls: done ? 'ok' : (i === c.length ? 'on' : '')
    }));
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => {
      if (k === '') return { text: '', label: 'blank', cls: 'ghost', press: () => {} };
      if (k === 'del') return { text: '⌫', label: 'Delete', cls: 'ghost', press: () => this.setState({ c: this.state.c.slice(0, -1) }) };
      return { text: k, label: k, cls: '', press: () => { if (this.state.c.length < 6) this.setState({ c: this.state.c + k }); } };
    });
    return {
      boxes, keys, done, notDone: !done,
      status: done ? 'Code complete. Tap Verify.' : 'Waiting for the SMS. On Android we fill it in for you.',
      statusColor: done ? 'var(--success)' : 'var(--ink-muted)'
    };
  }
}
</script>
</body>
</html>

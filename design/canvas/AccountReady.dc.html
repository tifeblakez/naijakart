<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account ready</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <div class="m-col abs" style="left: var(--sl); top: 30px; width: 440px; align-items: center; text-align: center; gap: 8px">
    <span class="m-av photo-face" role="img" aria-label="TifeSpeed" style="width: 112px; height: 112px; box-shadow: 0 0 0 3px var(--outline), 0 0 0 7px var(--danfo), 0 0 30px 6px var(--danfo)">T</span>
    <span class="m-row" style="gap: 6px"><span class="nk-rank nk-rank--s tier-jjc"><span class="nk-rank__plate">III</span></span><span class="d ol-sm" style="font-size: 16px; color: var(--rank-jjc)">JJC · Lagos</span></span>
    <h1 class="d ol-lg" style="font-size: 32px; line-height: 34px">You don land, TifeSpeed!</h1>
    <p class="m-body" style="max-width: 380px">Progress saved. Sign in on any phone with +234 803 ••• 5567.</p>
    <span class="m-row nk-glass" style="gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px"><span class="m-coin m-coin--c" style="width: 30px; height: 30px; font-size: 16px">C</span><span class="d ol-sm" style="font-size: 20px; color: var(--danfo)">+500</span><span class="m-small">Account bonus</span></span>
  </div>

  <div class="m-col abs" style="right: var(--sr); top: 30px; bottom: var(--sb); width: 300px; gap: 10px">
    <div class="nk-glass m-col" style="padding: 12px; border-radius: 16px; gap: 8px">
      <span class="d ol-sm" style="font-size: 20px">Bring your guys</span>
      <p class="m-small" style="color: var(--ink-muted); margin: 0">When a friend joins with your code, you both get 300 Coins after their first race.</p>
      <button type="button" class="m-btn m-btn--social">Share on WhatsApp</button>
      <span class="m-row" style="justify-content: space-between"><span class="m-col" style="gap: 0"><span class="m-eyebrow">Your code</span><span class="d" style="font-size: 18px; letter-spacing: 0.06em">TIFE-4K2</span></span><button type="button" class="m-btn m-btn--sec m-btn--sm" style="min-height: 44px">Copy</button></span>
    </div>
    <span style="flex-grow: 1"></span>
    <a class="m-btn m-btn--primary m-btn--xl" href="Matchmaking.dc.html">Race now</a>
    <a class="m-btn" href="Main.dc.html" style="background: transparent; color: var(--ink-muted)">Go home</a>
  </div>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>

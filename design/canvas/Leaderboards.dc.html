<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaderboards</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/naijakart/tokens.css">
<link rel="stylesheet" href="ds/naijakart/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone"><div class="screen">
  <div class="layer scene-city"></div>
  <div class="layer dim-full"></div>

  <div class="m-sub">
    <a class="m-icon-btn nk-glass" href="Profile.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 class="d ol" style="font-size: 24px; line-height: 26px">Who get mouth?</h1>
    <span style="flex-grow: 1"></span>
    <div class="m-tabs nk-glass">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{ t.pick }}" class="m-tab" style="background: {{ t.bg }}; color: {{ t.fg }}">{{ t.name }}</button>
      </sc-for>
    </div>
  </div>

  <div class="nk-glass m-col abs" style="left: var(--sl); top: 66px; width: 460px; padding: 8px; box-sizing: border-box; border-radius: 16px; gap: 4px">
    <div class="m-row" style="padding: 0 10px; gap: 10px"><span class="m-eyebrow" style="width: 36px">Pos</span><span class="m-eyebrow" style="flex-grow: 1">Racer</span><span class="m-eyebrow">{{ scoreLabel }}</span></div>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
      <sc-if value="{{ r.gap }}" hint-placeholder-val="{{ false }}">
        <div class="d" style="text-align: center; color: var(--ink-faint); letter-spacing: 0.3em; font-size: 14px; line-height: 14px">· · ·</div>
      </sc-if>
      <sc-if value="{{ r.real }}" hint-placeholder-val="{{ true }}">
        <div class="m-row" style="height: 34px; padding: 0 10px; gap: 10px; border-radius: 8px; background: {{ r.bg }}; color: {{ r.fg }}">
          <span class="d" style="width: 36px; font-size: 17px; text-align: right">{{ r.pos }}</span>
          <span class="nk-rank nk-rank--s {{ r.tier }}"><span class="nk-rank__plate" style="width: 30px; height: 22px; font-size: 11px">{{ r.plate }}</span></span>
          <b style="flex-grow: 1; font-size: 13px; font-style: italic">{{ r.name }}</b>
          <span class="d" style="font-size: 15px">{{ r.score }}</span>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div class="m-col abs" style="left: 530px; right: var(--sr); top: 66px; gap: 8px">
    <div class="nk-glass m-col" style="padding: 10px 12px; border-radius: 16px; gap: 6px">
      <span class="m-row" style="gap: 8px"><span class="nk-rank nk-rank--s tier-chairman"><span class="nk-rank__plate">II</span></span><span class="m-col" style="gap: 0"><span class="d ol-sm" style="font-size: 18px; color: var(--rank-chairman)">Chairman</span><span class="m-small">Nigeria #124 · up 8</span></span></span>
      <div><div class="m-prog-head"><span>To Chairman I</span><span>88 / 100 RP</span></div><div class="m-track"><div class="m-fill" style="width: 88%"></div></div></div>
    </div>
    <div class="nk-glass" style="padding: 10px 12px; border-radius: 16px">
      <p class="m-eyebrow" style="margin-bottom: 3px">Season ends in 23 days</p>
      <p class="m-body">Top 100 become <span style="color: var(--rank-oga-patapata)">Oga Patapata</span>. Everyone drops one tier at reset.</p>
    </div>
  </div>
  <a class="m-btn m-btn--primary abs" href="ModeSelect.dc.html" style="left: 530px; right: var(--sr); bottom: var(--sb)">Play Ranked</a>

  <div class="island"></div><div class="homebar"></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":872,"height":418}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Nigeria' }; }
  renderVals() {
    const names = ['Friends', 'Nigeria', 'Global', 'Track'];
    const track = this.state.tab === 'Track';
    const data = [
      [1, 'Chuks_Lagos', 'tier-oga-patapata', '#1', track ? '3:12.88' : '2,914'],
      [2, 'Ngozi', 'tier-oga-patapata', '#2', track ? '3:13.40' : '2,860'],
      [3, 'Abdul K', 'tier-oga-patapata', '#3', track ? '3:13.95' : '2,811'],
      null,
      [123, 'Ifeoma', 'tier-chairman', 'II', track ? '3:18.36' : '1,969'],
      [124, 'Tife (you)', 'tier-chairman', 'II', track ? '3:18.40' : '1,964', true],
      [125, 'Ada', 'tier-chairman', 'II', track ? '3:18.51' : '1,961']
    ];
    return {
      scoreLabel: track ? 'Best time' : 'RP',
      tabs: names.map(n => ({ name: n, pick: () => this.setState({ tab: n }), bg: n === this.state.tab ? 'var(--danfo)' : 'transparent', fg: n === this.state.tab ? 'var(--on-danfo)' : 'var(--ink-muted)' })),
      rows: data.map(d => d ? {
        real: true, gap: false, pos: d[0], name: d[1], tier: d[2], plate: d[3], score: d[4],
        bg: d[5] ? 'var(--danfo)' : 'var(--plate-glass-solid)', fg: d[5] ? 'var(--on-danfo)' : 'var(--ink)'
      } : { real: false, gap: true })
    };
  }
}
</script>
</body>
</html>

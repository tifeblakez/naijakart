function speech(h, s, dur){ speechEl.querySelector('.h').textContent = h; speechEl.querySelector('.s').textContent = s; speechUntil = dur; }
const events = replay.events; let evIdx = 0;
const SPEECH = {RaceStarted: ['GO!', 'MOVE AM!'], Overtake: ['SHARP!', 'YOU PASS AM'], Overtaken: ['OMO!', 'DEM DEY COME!'], ItemHit: ['OMO!', 'DEM DEY COME!'], HazardHit: ['WAHALA!', 'HOLD THE WHEEL'], BoostStarted: ['FULL TANK!', 'FIRE DEY BURN'], ItemGranted: ['I DON GET AM!', 'USE AM WELL'], LastmaWarning: ['LASTMA!', 'DEM DEY COME!'], LastmaEscaped: ['I ESCAPE!', 'NO WAHALA'], LastmaCaught: ['PULL OVER!', 'LASTMA DON CATCH ME'], LapCompleted: ['ONE MORE!', 'KEEP AM UP'], FinalLapStarted: ['LAST LAP!', 'NO SHAKING'], RaceFinished: ['WE DON REACH!', 'EKO O NI BAJE'], CollisionBump: ['EH!', 'WATCH AM'], DriftBoost: ['SHARP DRIFT!', 'FIRE DEY BURN']};

// ---------------------------------------------------------------- frame rendering
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let camInit = false, lastT = null;
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType}));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), night ? 0.6 : 0.42, 0.55, night ? 0.8 : 0.92); composer.addPass(bloom);
const grade = new ShaderPass({uniforms: {tDiffuse: {value: null}, uSat: {value: 1.3}, uCon: {value: 1.06}, uVig: {value: 0.32}},
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uSat, uCon, uVig; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); float l = dot(c.rgb, vec3(0.299, 0.587, 0.114)); c.rgb = mix(vec3(l), c.rgb, uSat); c.rgb = (c.rgb - 0.5) * uCon + 0.5 + 0.01; c.rgb *= vec3(1.03, 1.0, 0.97);
      vec2 d = vUv - 0.5; c.rgb *= 1.0 - uVig * dot(d, d) * 2.2; gl_FragColor = c; }`});
composer.addPass(grade);
composer.addPass(new OutputPass());

const hudEl = document.getElementById('hud'), titleEl = document.getElementById('title');
window.renderAt = function(t, mode){
  hudEl.style.visibility = mode === 'overview' ? 'hidden' : 'visible';
  titleEl.style.display = mode === 'overview' ? 'block' : 'none';
  if (mode === 'overview') titleEl.style.opacity = Math.min(1, Math.max(0, (t + 2.2) * 1.5));
  const dt = lastT === null ? 1/fps : Math.max(0, Math.min(0.1, t - lastT)); lastT = t;
  uTime.value = Math.max(0, t + 5);
  const {a, b, u} = frameAt(t);
  let me = null;
  for (const ka of a.karts){
    const kb = b.karts.find(x => x.id === ka.id) || ka;
    const k = karts[ka.id]; if (!k) continue;
    const x = ka.x + (kb.x - ka.x)*u, y = ka.y + (kb.y - ka.y)*u, z = ka.z + (kb.z - ka.z)*u;
    const yaw = lerpAngle(ka.h, kb.h, u);
    k.group.position.set(x, y, z);
    const targetLean = (ka.d ? -ka.dd*0.12 : 0) - ka.lat*0.015;
    k.lean += (targetLean - k.lean) * Math.min(1, dt*8);
    k.group.rotation.set(ka.stun ? Math.sin(t*20)*0.08 : 0, yaw + (ka.d ? ka.dd*0.25 : 0), k.lean);
    k.group.visible = ka.st !== 'Disconnected';
    if (ka.id !== follow && camInit && k.group.position.distanceTo(camPos) < 3.4) k.group.visible = false;   // never block the player's own view
    const fwd = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)), right = new THREE.Vector3(fwd.z, 0, -fwd.x);
    if (ka.d && ka.v > 6){
      for (const s of [-1, 1]){
        const wx = x + right.x*s*0.9 - fwd.x*0.95, wz = z + right.z*s*0.9 - fwd.z*0.95;
        for (let n = 0; n < 3; n++) emit(sparks, wx, y + 0.08, wz, -fwd.x*4 + right.x*s*1.5, 2.5, -fwd.z*4 + right.z*s*1.5, 3.5, 0.35 + rnd()*0.3);
        emit(smoke, wx, y + 0.2, wz, -fwd.x*2 + right.x*s*0.8, 0.8, -fwd.z*2 + right.z*s*0.8, 1.2, 0.6 + rnd()*0.5);
      }
    }
    if (ka.b){
      for (let n = 0; n < 4; n++) emit(flame, x - fwd.x*1.35, y + 0.5, z - fwd.z*1.35, -fwd.x*8, 0.3, -fwd.z*8, 1.5, 0.12 + rnd()*0.12);
    }
    if (ka.id === follow) me = {...ka, x, y, z, yaw, fwd, right};
  }
  stepParticles(sparks, dt); stepParticles(smoke, dt); stepParticles(flame, dt);
  // hazards
  const seen = new Set();
  for (const h of a.hazards){
    seen.add(h.id);
    let o = hazardObjs[h.id];
    if (!o){ o = instantiate(hazardTemplate(h.k)); scene.add(o); hazardObjs[h.id] = o; }
    o.position.set(h.x, h.y, h.z); if (h.dx || h.dz) o.rotation.y = Math.atan2(h.dx, h.dz);
    o.visible = true;
    if (!h.armed) o.position.y += Math.sin(t*12)*0.15;
  }
  for (const id in hazardObjs) if (!seen.has(id)) hazardObjs[id].visible = false;
  for (const g of propGroups) if (g.userData.template === 'item_box'){ g.rotation.y = t*1.6; g.rotation.x = Math.sin(t*0.9)*0.2; g.position.y = g.userData.baseY + Math.sin(t*2 + g.position.x)*0.2; }

  // camera
  if (me){
    const fwd = me.fwd, right = me.right;
    if (mode === 'overview'){
      const u = Math.max(0, t + 3) / 5;   // 0..1 across the intro
      const ang = Math.PI*1.25 - u*0.5; const r = 260 - u*60;
      const cx = 17, cz = 170;
      camera.position.set(cx + Math.cos(ang)*r, 95 - u*45, cz + Math.sin(ang)*r); camera.lookAt(cx + 20, 6, cz + 80); camera.fov = 48;
      camInit = false;
    } else {
      const dist = 4.9 + me.v*0.022, height = 2.3;
      const desired = new THREE.Vector3(me.x, me.y, me.z).addScaledVector(fwd, -dist).add(new THREE.Vector3(0, height, 0));
      if (me.d) desired.addScaledVector(right, -me.dd*1.0);
      const look = new THREE.Vector3(me.x, me.y + 0.45, me.z).addScaledVector(fwd, 6.5);
      if (!camInit){ camPos.copy(desired); camLook.copy(look); camInit = true; }
      camPos.lerp(desired, 1 - Math.exp(-6.5*dt)); camLook.lerp(look, 1 - Math.exp(-9*dt));
      camera.position.copy(camPos); camera.lookAt(camLook);
      camera.rotation.z += me.lat*0.004;
      camera.fov = 58 + Math.min(me.v, 45)*0.2 + (me.b ? 9 : 0);
    }
    camera.updateProjectionMatrix();
    sun.position.set(me.x + sunDir.x*300, sunDir.y*300, me.z + sunDir.z*300); sun.target.position.set(me.x, me.y, me.z); sun.target.updateMatrixWorld();
    // HUD
    document.getElementById('pos').innerHTML = `<span class="n">${me.p}</span><span class="o">${ord(me.p)}</span><span class="t">/${a.karts.length}</span>`;
    document.getElementById('lap').innerHTML = `<div><span class="l">LAP</span><span class="n">${Math.min(me.l+1, replay.laps)}/${replay.laps}</span></div><div class="tm">⏱ ${fmt(Math.max(0, t))}</div>`;
    const kmh = Math.round(me.v*3.6); document.getElementById('kmh').textContent = kmh; drawGauge(kmh/200);
    document.getElementById('charges').textContent = me.bc || 0;
    setSlots(me.it);
    const sorted = [...a.karts].sort((p, q) => p.p - q.p); const myI = sorted.findIndex(k => k.id === follow); const start = Math.max(0, Math.min(sorted.length - 5, myI - 3));
    document.getElementById('stand').innerHTML = sorted.slice(start, start + 5).map(k => `<div class="row ${k.id === follow ? 'you' : ''}"><span class="i">${k.p}</span><span class="d" style="background:${k.id === follow ? '#141628' : karts[k.id]?.color}"></span><span>${k.id === follow ? 'You' : (karts[k.id]?.name || k.id)}</span></div>`).join('');
    drawMap(a.karts);
    document.getElementById('drift').style.borderColor = me.d ? '#ffd23c' : '#f58220';
  }
  if (t < -2.5 && bannerUntil < 0){ banner('THIRD MAINLAND RUSH', 'Lagos · 3 laps · 8 racers', 2.0); }
  while (evIdx < events.length && events[evIdx].t <= t){
    const e = events[evIdx++];
    if (t - e.t > 2.5) continue;   // stale (frame-stepping warm-up)
    const mine = e.p === follow, target = e.target === follow;
    if (e.type === 'RaceStarted') { banner('GO!', 'Move am!', t + 1.2, '#1b9e4b'); speech('GO!', 'MOVE AM!', t + 2.5); }
    else if (e.type === 'FinalLapStarted') { banner('FINAL LAP', 'No shaking', t + 3); }
    else if (e.type === 'GatePassed' && e.payload === 'shortcut' && mine) { banner('SHORTCUT: UNDER BRIDGE', 'Faster, but LASTMA dey watch', t + 3.5); }
    else if (e.type === 'LastmaWarning' && mine) { banner('LASTMA DEY COME!', 'Pull over or run', t + 3, '#f58220'); }
    else if (e.type === 'Overtake' && target) { speech('OMO!', 'DEM DEY COME!', t + 2.5); }
    if (mine && SPEECH[e.type]) speech(SPEECH[e.type][0], SPEECH[e.type][1], t + 2.5);
    if ((e.type === 'ItemHit' || e.type === 'HazardHit') && mine) flashUntil = t + 0.15;
  }
  if (t > bannerUntil) bannerEl.style.display = 'none';
  if (t > speechUntil && speechUntil > 0) { speech('OYA!', 'NO SHAKING', -1); }
  flashEl.style.opacity = t < flashUntil ? 0.35 : 0;
  composer.render();
  return true;
};
window.__ready = true;
</script>
</body>
</html>
